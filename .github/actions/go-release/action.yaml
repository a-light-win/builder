name: go-release
description: "pack and upload the go project on tags"
inputs:
  working_directory:
    description: The root path of the go project
    required: true
  GITHUB_TOKEN:
    description: "The Github token"
    required: true
runs:
  using: composite
  steps:
    - name: Setup qemu user static
      run: |
        just -g podman setup-qemu-user-static
      shell: bash
      working-directory: ${{ inputs.working_directory }}
    - name: Build and Pack
      run: |
        just -g go pack-all
      shell: bash
      working-directory: ${{ inputs.working_directory }}
    - name: Release
      run: |
        just -g github release "${{ github.repository }}"
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
